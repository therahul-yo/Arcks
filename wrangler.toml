# Arcks - Cloudflare Worker
# Deploy with: wrangler deploy

name = "arcks"
main = "worker.js"
compatibility_date = "2025-05-01"

# Required secrets (set via wrangler secret put):
#   GEMINI_API_KEY       - Google Gemini API key (used when provider=gemini)
#   OPENROUTER_API_KEY   - OpenRouter API key (used when provider=openrouter)
#
# Optional env vars:
#   DEFAULT_PROVIDER     - "gemini" or "openrouter" (default: gemini)

[[kv_namespaces]]
binding = "ARCKS_KV"
id = "YOUR_KV_NAMESPACE_ID"
