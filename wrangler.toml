# Arcks - Cloudflare Worker
# Deploy with: wrangler deploy

name = "arcks"
main = "worker.js"
compatibility_date = "2025-05-01"

# Required secrets (set via wrangler secret put):
#   GEMINI_API_KEY       - Google Gemini API key (used when provider=gemini)
#   OPENROUTER_API_KEY   - OpenRouter API key (used when provider=openrouter)
#   NIM_API_KEY          - NVIDIA NIM API key (used when provider=nvidia)
#
# Optional env vars:
#   DEFAULT_PROVIDER     - "gemini" or "openrouter"

[vars]
DEFAULT_PROVIDER = "openrouter"

[[kv_namespaces]]
binding = "ARCKS_KV"
id = "a0388565d0744758bbae84ae7207dd1a"
